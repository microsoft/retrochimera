model_class: TemplateLocalization
num_processes_training: 6
float32_matmul_precision: high
template_localization_config:
  input_encoder:
    mol_out_channels: 1024
    gnn_kwargs:
      hidden_channels: 1024
      num_layers: 5
      dropout: 0.05
  rewrite_encoder:
    mol_out_channels: 992
    atom_categorical_features_channels: 32
    gnn_kwargs:
      hidden_channels: 192
      num_layers: 5
  classification_label_smoothing: 0.05
  classification_space_dim: null
  free_rewrite_embedding_dim: 32
  num_negative_rewrites_in_localization: 4
  training:
    batch_size: 1024
    learning_rate: 0.001
    learning_rate_decay_step_size: 55
    n_epochs: 65
    check_val_every_n_epoch: 1
    num_checkpoints_for_averaging: 10
    n_devices: 4
  classification_loss_type: softmax
  negative_to_positive_targets_ratio: 18
  rewrite_encoder_num_epochs: 30
